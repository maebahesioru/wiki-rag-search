services:
  meilisearch:
    image: getmeili/meilisearch:v1.52.0
    container_name: wiki-search-meili
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
volumes:
  meili_data:
